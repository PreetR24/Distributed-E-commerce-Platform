apiVersion: apps/v1
kind: Deployment

metadata:
  name: graphql-gateway
  namespace: dcp

spec:
  replicas: 1

  selector:
    matchLabels:
      app: graphql-gateway

  template:
    metadata:
      labels:
        app: graphql-gateway

    spec:
      containers:
        - name: graphql-gateway
          image: distributed-commerce-platform-graphql-gateway:latest
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 4010

          envFrom:
            - configMapRef:
                name: shared-config

            - secretRef:
                name: shared-jwt-secret

          env:
            - name: PORT
              value: "4010"

            - name: SERVICE_NAME
              value: "graphql-gateway-service"

          resources:
            requests:
              cpu: 100m
              memory: 128Mi

            limits:
              cpu: 500m
              memory: 512Mi

          startupProbe:
            httpGet:
              path: /api/v1/health/live
              port: 4010
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 12

          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: 4010
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: 4010
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3