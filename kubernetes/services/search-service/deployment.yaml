apiVersion: apps/v1
kind: Deployment

metadata:
  name: search-service
  namespace: dcp

spec:
  replicas: 1

  selector:
    matchLabels:
      app: search-service

  template:
    metadata:
      labels:
        app: search-service

    spec:
      enableServiceLinks: false

      containers:
        - name: search-service
          image: distributed-commerce-platform-search-service:latest
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 4007

          envFrom:
            - configMapRef:
                name: shared-config

            - secretRef:
                name: shared-jwt-secret

            - secretRef:
                name: search-secret

          env:
            - name: PORT
              value: "4007"

            - name: SERVICE_NAME
              value: "search-service"

            - name: PRODUCT_SERVICE_URL
              value: "http://product-service:4002/api/v1"

            - name: PRODUCT_GRPC_URL
              value: "product-service:50052"

          resources:
            requests:
              cpu: 100m
              memory: 128Mi

            limits:
              cpu: 500m
              memory: 512Mi

          startupProbe:
            httpGet:
              path: /api/v1/health/live
              port: 4007
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: 4007
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: 4007
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3