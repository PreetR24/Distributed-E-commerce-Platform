apiVersion: v1
kind: ConfigMap

metadata:
  name: prometheus-alerts
  namespace: monitoring

data:
  alerts.yml: |
    groups:

      - name: kubernetes-alerts
        rules:

          - alert: TargetDown
            expr: up == 0
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "Prometheus target is down"
              description: "The Prometheus target {{ $labels.job }} has been down for more than 2 minutes."

          - alert: HighCPUUsage
            expr: 100 * (1 - avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m]))) > 80
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High CPU usage"
              description: "CPU usage on {{ $labels.instance }} has been above 80% for more than 5 minutes."

          - alert: HighMemoryUsage
            expr: 100 * (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) > 80
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High memory usage"
              description: "Memory usage on {{ $labels.instance }} has been above 80% for more than 5 minutes."