apiVersion: apps/v1
kind: Deployment

metadata:
  name: order-service
  namespace: dcp

spec:
  replicas: 1

  selector:
    matchLabels:
      app: order-service

  template:
    metadata:
      labels:
        app: order-service

    spec:
      enableServiceLinks: false

      containers:
        - name: order-service
          image: distributed-commerce-platform-order-service:latest
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 4004
            - containerPort: 50051

          envFrom:
            - configMapRef:
                name: shared-config

            - secretRef:
                name: shared-jwt-secret

            - secretRef:
                name: order-secret

          env:
            - name: PORT
              value: "4004"

            - name: SERVICE_NAME
              value: "order-service"

            - name: ORDER_GRPC_HOST
              value: "0.0.0.0"

            - name: ORDER_GRPC_PORT
              value: "50051"

            - name: PRODUCT_GRPC_URL
              value: "product-service:50052"

            - name: INVENTORY_GRPC_URL
              value: "inventory-service:50053"

          resources:
            requests:
              cpu: 100m
              memory: 128Mi

            limits:
              cpu: 500m
              memory: 512Mi

          startupProbe:
            httpGet:
              path: /api/v1/health/live
              port: 4004
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: 4004
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: 4004
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3