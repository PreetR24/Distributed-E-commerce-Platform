apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: elasticsearch
  namespace: dcp
  labels:
    app: elasticsearch
    component: search-engine

spec:
  serviceName: elasticsearch-headless

  replicas: 1

  revisionHistoryLimit: 3

  updateStrategy:
    type: RollingUpdate

  selector:
    matchLabels:
      app: elasticsearch

  template:
    metadata:
      labels:
        app: elasticsearch
        component: search-engine

    spec:
      terminationGracePeriodSeconds: 30

      containers:
        - name: elasticsearch

          image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4

          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 9200

            - name: transport
              containerPort: 9300

          env:
            - name: discovery.type
              value: single-node

            - name: xpack.security.enabled
              value: "false"

            - name: ES_JAVA_OPTS
              value: "-Xms512m -Xmx512m"

          volumeMounts:
            - name: elasticsearch-storage
              mountPath: /usr/share/elasticsearch/data

          resources:
            requests:
              cpu: 500m
              memory: 1Gi

            limits:
              cpu: "2"
              memory: 2Gi

          startupProbe:
            httpGet:
              path: /
              port: 9200
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /
              port: 9200
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /
              port: 9200
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

          terminationMessagePolicy: FallbackToLogsOnError

  volumeClaimTemplates:
    - metadata:
        name: elasticsearch-storage

      spec:
        accessModes:
          - ReadWriteOnce

        resources:
          requests:
            storage: 10Gi