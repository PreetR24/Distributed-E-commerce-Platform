apiVersion: apps/v1
kind: Deployment

metadata:
  name: analytics-service
  namespace: dcp

spec:
  replicas: 1

  selector:
    matchLabels:
      app: analytics-service

  template:
    metadata:
      labels:
        app: analytics-service

    spec:
      enableServiceLinks: false

      containers:
        - name: analytics-service
          image: distributed-commerce-platform-analytics-service:latest
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 4008

          envFrom:
            - configMapRef:
                name: shared-config

            - secretRef:
                name: shared-jwt-secret

            - secretRef:
                name: analytics-secret

          env:
            - name: PORT
              value: "4008"

            - name: SERVICE_NAME
              value: "analytics-service"

          resources:
            requests:
              cpu: 100m
              memory: 128Mi

            limits:
              cpu: 500m
              memory: 512Mi

          startupProbe:
            httpGet:
              path: /api/v1/health/live
              port: 4008
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: 4008
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: 4008
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3