apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

resources:
  - secret.yaml
  - datasource.yaml
  - dashboard-provider.yaml
  - statefulset.yaml
  - service.yaml
  - headless-service.yaml

configMapGenerator:
  - name: grafana-dashboards
    files:
      - dashboards/01-System-Overview.json
      - dashboards/02-HTTP-API-Performance.json
      - dashboards/03-Business-Metrics.json
      - dashboards/04-Redis-Cache.json
      - dashboards/05-RabbitMQ-Messaging.json
      - dashboards/06-gRPC-Communication.json
      - dashboards/07-Infrastructure.json
      - dashboards/08-Service-Health.json