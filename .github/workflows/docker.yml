name: Docker

on:
  push:
    paths:
      - 'docker-compose.yml'
      - '**/Dockerfile'

jobs:
  docker:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Validate Compose
        run: docker compose config

      - name: Build Containers
        run: docker compose build