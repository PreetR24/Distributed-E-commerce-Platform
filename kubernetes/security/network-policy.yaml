apiVersion: networking.k8s.io/v1
kind: NetworkPolicy

metadata:
  name: dcp-application-policy
  namespace: dcp

spec:
  podSelector:
    matchLabels:
      app: user-service

  policyTypes:
    - Ingress

  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: dcp