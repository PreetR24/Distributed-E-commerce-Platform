apiVersion: v1
kind: Service

metadata:
  name: elasticsearch-headless
  namespace: dcp
  labels:
    app: elasticsearch
    component: search-engine

spec:
  clusterIP: None

  selector:
    app: elasticsearch

  ports:
    - name: http
      port: 9200
      targetPort: http

    - name: transport
      port: 9300
      targetPort: transport