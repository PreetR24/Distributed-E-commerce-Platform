apiVersion: v1
kind: Service

metadata:
  name: rabbitmq-headless
  namespace: dcp
  labels:
    app: rabbitmq
    component: message-broker

spec:
  clusterIP: None

  selector:
    app: rabbitmq

  ports:
    - name: amqp
      port: 5672
      targetPort: amqp

    - name: management
      port: 15672
      targetPort: management