apiVersion: v1
kind: ConfigMap

metadata:
  name: prometheus-config
  namespace: monitoring

data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    rule_files:
      - /etc/prometheus/rules/alerts.yml

    scrape_configs:

      - job_name: "api-gateway"
        metrics_path: /metrics
        static_configs:
          - targets:
              - api-gateway-service.dcp.svc.cluster.local:3000

      - job_name: "graphql-gateway"
        metrics_path: /metrics
        static_configs:
          - targets:
              - graphql-gateway-service.dcp.svc.cluster.local:4010

      - job_name: "user-service"
        metrics_path: /metrics
        static_configs:
          - targets:
              - user-service.dcp.svc.cluster.local:4001

      - job_name: "product-service"
        metrics_path: /metrics
        static_configs:
          - targets:
              - product-service.dcp.svc.cluster.local:4002

      - job_name: "cart-service"
        metrics_path: /metrics
        static_configs:
          - targets:
              - cart-service.dcp.svc.cluster.local:4003

      - job_name: "order-service"
        metrics_path: /metrics
        static_configs:
          - targets:
              - order-service.dcp.svc.cluster.local:4004

      - job_name: "payment-service"
        metrics_path: /metrics
        static_configs:
          - targets:
              - payment-service.dcp.svc.cluster.local:4005

      - job_name: "inventory-service"
        metrics_path: /metrics
        static_configs:
          - targets:
              - inventory-service.dcp.svc.cluster.local:4006

      - job_name: "search-service"
        metrics_path: /metrics
        static_configs:
          - targets:
              - search-service.dcp.svc.cluster.local:4007

      - job_name: "analytics-service"
        metrics_path: /metrics
        static_configs:
          - targets:
              - analytics-service.dcp.svc.cluster.local:4008

      - job_name: "notification-service"
        metrics_path: /metrics
        static_configs:
          - targets:
              - notification-service.dcp.svc.cluster.local:4009