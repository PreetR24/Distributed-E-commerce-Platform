services:

    redis:
        image: redis:7
        container_name: distributed-commerce-redis
        ports:
            - '6379:6379'
        volumes:
            - redis_data:/data
        restart: unless-stopped
        networks:
            - commerce-network
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5

    rabbitmq:
        image: rabbitmq:3-management
        container_name: distributed-commerce-rabbitmq
        ports:
            - '5672:5672'
            - '15672:15672'
        volumes:
            - rabbitmq_data:/var/lib/rabbitmq
        restart: unless-stopped
        networks:
            - commerce-network
        healthcheck:
            test: ["CMD", "rabbitmq-diagnostics","-q", "ping"]
            interval: 30s
            timeout: 10s
            retries: 10
            start_period: 30s  

    api-gateway:
        build:
            context: .
            dockerfile: api-gateway/Dockerfile
        container_name:
            distributed-commerce-api-gateway
        ports:
            - "3000:3000"
        env_file:
            - ./api-gateway/.env
            - ./shared/.env
        depends_on:
            product-service:
                condition: service_started
            user-service:
                condition: service_started
            cart-service:
                condition: service_started
            order-service:
                condition: service_started
            payment-service:
                condition: service_started
            inventory-service:
                condition: service_started
            search-service:
                condition: service_started
            analytics-service:
                condition: service_started
            notification-service:
                condition: service_started
            graphql-gateway:
                condition: service_started
        networks:
            - commerce-network
        healthcheck:
            test:
                [
                    "CMD",
                    "node",
                    "-e",
                    "fetch('http://localhost:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
                ]
            interval: 30s
            timeout: 5s
            retries: 5
            start_period: 30s

    user-service:
        build:
            context: .
            dockerfile: services/user-service/Dockerfile
        container_name:
            distributed-commerce-user-service
        env_file:
            - ./shared/.env
            - ./services/user-service/.env
        ports:
            - "4001:4001"
        depends_on:
            postgres:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
        networks:
            - commerce-network    
        healthcheck:
            test:
                [
                    "CMD",
                    "node",
                    "-e",
                    "fetch('http://localhost:4001/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
                ]
            interval: 30s
            timeout: 5s
            retries: 5
            start_period: 30s  

    product-service:
        build:
            context: .
            dockerfile: services/product-service/Dockerfile
        container_name:
            distributed-commerce-product-service
        env_file:
            - ./shared/.env
            - ./services/product-service/.env
        ports:
            - "4002:4002"
        depends_on:
            postgres:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
            redis:
                condition: service_healthy
        networks:
            - commerce-network  
        healthcheck:
            test:
                [
                    "CMD",
                    "node",
                    "-e",
                    "fetch('http://localhost:4002/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
                ]
            interval: 30s
            timeout: 5s
            retries: 5
            start_period: 30s

    cart-service:
        build:
            context: .
            dockerfile: services/cart-service/Dockerfile
        container_name:
            distributed-commerce-cart-service
        ports:
            - "4003:4003"
        env_file:
            - ./shared/.env
            - ./services/cart-service/.env
        depends_on:
            postgres:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
            redis:
                condition: service_healthy
        networks:
            - commerce-network   
        healthcheck:
            test:
                [
                    "CMD",
                    "node",
                    "-e",
                    "fetch('http://localhost:4003/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
                ]
            interval: 30s
            timeout: 5s
            retries: 5
            start_period: 30s 

    order-service:
        build:
            context: .
            dockerfile: services/order-service/Dockerfile
        container_name:
            distributed-commerce-order-service
        ports:
            - "4004:4004"
        env_file:
            - ./shared/.env
            - ./services/order-service/.env
        depends_on:
            postgres:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
            redis:
                condition: service_healthy
            product-service:
                condition: service_started
            inventory-service:
                condition: service_started
        networks:
            - commerce-network
        healthcheck:
            test:
                [
                    "CMD",
                    "node",
                    "-e",
                    "fetch('http://localhost:4004/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
                ]
            interval: 30s
            timeout: 5s
            retries: 5
            start_period: 30s

    payment-service:
        build:
            context: .
            dockerfile: services/payment-service/Dockerfile
        container_name: distributed-commerce-payment-service
        ports:
            - "4005:4005"
        env_file:
            - ./shared/.env
            - ./services/payment-service/.env
        depends_on:
            postgres:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
            redis:
                condition: service_healthy
            order-service:
                condition: service_started
        networks:
            - commerce-network
        healthcheck:
            test:
                [
                    "CMD",
                    "node",
                    "-e",
                    "fetch('http://localhost:4005/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
                ]
            interval: 30s
            timeout: 5s
            retries: 5
            start_period: 30s

    inventory-service:
        build:
            context: .
            dockerfile: services/inventory-service/Dockerfile
        container_name: distributed-commerce-inventory-service
        ports:
            - "4006:4006"
        env_file:
            - ./shared/.env
            - ./services/inventory-service/.env
        depends_on:
            postgres:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
            redis:
                condition: service_healthy
        networks:
            - commerce-network
        healthcheck:
            test:
                [
                    "CMD",
                    "node",
                    "-e",
                    "fetch('http://localhost:4006/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
                ]
            interval: 30s
            timeout: 5s
            retries: 5
            start_period: 30s

    search-service:
        build:
            context: .
            dockerfile: services/search-service/Dockerfile
        container_name: distributed-commerce-search-service
        ports:
            - "4007:4007"
        env_file:
            - ./shared/.env
            - ./services/search-service/.env
        depends_on:
            postgres:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
            redis:
                condition: service_healthy
            elasticsearch:
                condition: service_healthy
            product-service:
                condition: service_started
        networks:
            - commerce-network
        healthcheck:
            test:
                [
                    "CMD",
                    "node",
                    "-e",
                    "fetch('http://localhost:4007/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
                ]
            interval: 30s
            timeout: 5s
            retries: 5
            start_period: 30s

    analytics-service:
        build:
            context: .
            dockerfile: services/analytics-service/Dockerfile
        container_name: distributed-commerce-analytics-service
        ports:
            - "4008:4008"
        env_file:
            - ./shared/.env
            - ./services/analytics-service/.env
        depends_on:
            postgres:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
            redis:
                condition: service_healthy
        networks:
            - commerce-network
        healthcheck:
            test:
                [
                    "CMD",
                    "node",
                    "-e",
                    "fetch('http://localhost:4008/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
                ]
            interval: 30s
            timeout: 5s
            retries: 5
            start_period: 30s

    notification-service:
        build:
            context: .
            dockerfile: services/notification-service/Dockerfile
        container_name: distributed-commerce-notification-service
        ports:
            - "4009:4009"
        env_file:
            - ./shared/.env
            - ./services/notification-service/.env
        depends_on:
            rabbitmq:
                condition: service_healthy
            redis:
                condition: service_healthy
        networks:
            - commerce-network
        healthcheck:
            test:
                [
                    "CMD",
                    "node",
                    "-e",
                    "fetch('http://localhost:4009/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
                ]
            interval: 30s
            timeout: 5s
            retries: 5
            start_period: 30s

    graphql-gateway:
        build:
            context: .
            dockerfile: graphql-gateway/Dockerfile
        container_name: distributed-commerce-graphql-gateway
        ports:
            - "4010:4010"
        env_file:
            - ./shared/.env
            - ./graphql-gateway/.env
        depends_on:
            user-service:
                condition: service_started
            product-service:
                condition: service_started
            order-service:
                condition: service_started
            cart-service:
                condition: service_started
            inventory-service:
                condition: service_started
            payment-service:
                condition: service_started
            analytics-service:
                condition: service_started
        networks:
            - commerce-network
        healthcheck:
            test:
                [
                    "CMD",
                    "node",
                    "-e",
                    "fetch('http://localhost:4010/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
                ]
            interval: 30s
            timeout: 5s
            retries: 5
            start_period: 30s

    postgres:
        image: postgres:16
        container_name: distributed-commerce-postgres
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: postgres
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
            - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
        restart: unless-stopped
        networks:
            - commerce-network
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s

    elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
        container_name: distributed-commerce-elasticsearch
        environment:
            - discovery.type=single-node
            - xpack.security.enabled=false
        ports:
            - "9200:9200"
        volumes:
            - elasticsearch_data:/usr/share/elasticsearch/data
        restart: unless-stopped
        networks:
            - commerce-network
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "curl -fs http://localhost:9200/_cluster/health || exit 1"
                ]
            interval: 30s
            timeout: 10s
            retries: 10
            start_period: 30s

    prometheus:
        image: prom/prometheus
        container_name: distributed-commerce-prometheus
        ports:
            - "9090:9090"
        volumes:
            - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
        restart: unless-stopped
        networks:
            - commerce-network
        healthcheck:
            test:
                [
                    "CMD",
                    "wget",
                    "--spider",
                    "-q",
                    "http://localhost:9090/-/healthy"
                ]
            interval: 30s
            timeout: 5s
            retries: 5
            start_period: 15s

    grafana:
        image: grafana/grafana
        container_name: distributed-commerce-grafana
        ports:
            - "3001:3000"
        restart: unless-stopped
        networks:
            - commerce-network
        volumes:
            - grafana_data:/var/lib/grafana
            
volumes:
    redis_data:
    rabbitmq_data:
    postgres_data:
    elasticsearch_data:
    grafana_data:

networks:
    commerce-network: