apiVersion: apps/v1
kind: Deployment

metadata:
  name: inventory-service
  namespace: dcp

spec:
  replicas: 1

  selector:
    matchLabels:
      app: inventory-service

  template:
    metadata:
      labels:
        app: inventory-service

    spec:
      enableServiceLinks: false

      containers:
        - name: inventory-service
          image: distributed-commerce-platform-inventory-service:latest
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 4006
            - containerPort: 50053

          envFrom:
            - configMapRef:
                name: shared-config

            - secretRef:
                name: shared-jwt-secret

            - secretRef:
                name: inventory-secret

          env:
            - name: PORT
              value: "4006"

            - name: SERVICE_NAME
              value: "inventory-service"

            - name: INVENTORY_GRPC_HOST
              value: "0.0.0.0"

            - name: INVENTORY_GRPC_PORT
              value: "50053"

          resources:
            requests:
              cpu: 100m
              memory: 128Mi

            limits:
              cpu: 500m
              memory: 512Mi

          startupProbe:
            httpGet:
              path: /api/v1/health/live
              port: 4006
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: 4006
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: 4006
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3