apiVersion: apps/v1
kind: Deployment

metadata:
  name: notification-service
  namespace: dcp

spec:
  replicas: 1

  selector:
    matchLabels:
      app: notification-service

  template:
    metadata:
      labels:
        app: notification-service

    spec:
      enableServiceLinks: false

      containers:
        - name: notification-service
          image: distributed-commerce-platform-notification-service:latest
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 4009

          envFrom:
            - configMapRef:
                name: shared-config

            - secretRef:
                name: notification-secret

            - secretRef:
                name: shared-jwt-secret

          env:
            - name: PORT
              value: "4009"

            - name: SERVICE_NAME
              value: "notification-service"

            - name: SAMPLE_USER
              value: "31adbe6f-83c1-456f-a54e-1ae27e22f8fb"

            - name: SOCKET_URL
              value: "http://notification-service:4009"

          resources:
            requests:
              cpu: 100m
              memory: 128Mi

            limits:
              cpu: 500m
              memory: 512Mi

          startupProbe:
            httpGet:
              path: /api/v1/health/live
              port: 4009
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: 4009
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: 4009
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3