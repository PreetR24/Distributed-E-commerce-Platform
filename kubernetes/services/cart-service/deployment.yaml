apiVersion: apps/v1
kind: Deployment

metadata:
  name: cart-service
  namespace: dcp

spec:
  replicas: 1

  selector:
    matchLabels:
      app: cart-service

  template:
    metadata:
      labels:
        app: cart-service

    spec:
      enableServiceLinks: false

      containers:
        - name: cart-service
          image: distributed-commerce-platform-cart-service:latest
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 4003

          envFrom:
            - configMapRef:
                name: shared-config

            - secretRef:
                name: shared-jwt-secret

          env:
            - name: PORT
              value: "4003"

            - name: SERVICE_NAME
              value: "cart-service"

          resources:
            requests:
              cpu: 100m
              memory: 128Mi

            limits:
              cpu: 500m
              memory: 512Mi

          startupProbe:
            httpGet:
              path: /api/v1/health/live
              port: 4003
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 12

          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: 4003
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: 4003
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3