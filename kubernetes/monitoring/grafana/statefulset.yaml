apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: grafana
  namespace: monitoring

spec:
  serviceName: grafana-headless

  replicas: 1

  selector:
    matchLabels:
      app: grafana

  template:
    metadata:
      labels:
        app: grafana

    spec:
      enableServiceLinks: false

      containers:
        - name: grafana
          image: grafana/grafana:latest
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 3000

          envFrom:
            - secretRef:
                name: grafana-secret

          env:
            - name: GF_SERVER_HTTP_PORT
              value: "3000"

          resources:
            requests:
              cpu: 100m
              memory: 128Mi

            limits:
              cpu: 500m
              memory: 512Mi

          startupProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

          volumeMounts:

            - name: grafana-storage
              mountPath: /var/lib/grafana

            - name: grafana-datasource
              mountPath: /etc/grafana/provisioning/datasources

            - name: grafana-dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards

            - name: grafana-dashboards
              mountPath: /var/lib/grafana/dashboards

      volumes:

        - name: grafana-datasource
          configMap:
            name: grafana-datasource

        - name: grafana-dashboard-provider
          configMap:
            name: grafana-dashboard-provider

        - name: grafana-dashboards
          configMap:
            name: grafana-dashboards

  volumeClaimTemplates:

    - metadata:
        name: grafana-storage

      spec:
        accessModes:
          - ReadWriteOnce

        resources:
          requests:
            storage: 2Gi