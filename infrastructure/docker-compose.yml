services:

    redis:
        image: redis:7
        container_name: distributed-commerce-redis
        ports:
            - '6379:6379'
        volumes:
            - redis_data:/data
        restart: unless-stopped

    rabbitmq:
        image: rabbitmq:3-management
        container_name: distributed-commerce-rabbitmq
        ports:
            - '5672:5672'
            - '15672:15672'
        volumes:
            - rabbitmq_data:/var/lib/rabbitmq
        restart: unless-stopped

    postgres-user:
        image: postgres:16
        container_name: distributed-commerce-postgres-user
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: distributed_commerce_user_db
        ports:
            - '5433:5432'
        volumes:
            - postgres_user_data:/var/lib/postgresql/data
        restart: unless-stopped

    postgres-product:
        image: postgres:16
        container_name: distributed-commerce-postgres-product
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: distributed_commerce_product_db
        ports:
            - '5434:5432'
        volumes:
            - postgres_product_data:/var/lib/postgresql/data
        restart: unless-stopped

    postgres-order:
        image: postgres:16
        container_name: distributed-commerce-postgres-order
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: distributed_commerce_order_db
        ports:
            - '5435:5432'
        volumes:
            - postgres_order_data:/var/lib/postgresql/data
        restart: unless-stopped

    postgres-payment:
        image: postgres:16
        container_name: distributed-commerce-postgres-payment
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: distributed_commerce_payment_db
        ports:
            - '5436:5432'
        volumes:
            - postgres_payment_data:/var/lib/postgresql/data
        restart: unless-stopped

    postgres-search:
        image: postgres:16
        container_name: distributed-commerce-postgres-search
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: distributed_commerce_search_db
        ports:
            - '5437:5432'
        volumes:
            - postgres_search_data:/var/lib/postgresql/data
        restart: unless-stopped

    postgres-analytics:
        image: postgres:16
        container_name: distributed-commerce-postgres-analytics
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: distributed_commerce_analytics_db
        ports:
            - '5438:5432'
        volumes:
            - postgres_analytics_data:/var/lib/postgresql/data
        restart: unless-stopped

    postgres-inventory:
        image: postgres:16
        container_name: distributed-commerce-postgres-inventory
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: distributed_commerce_inventory_db
        ports:
            - '5439:5432'
        volumes:
            - postgres_inventory_data:/var/lib/postgresql/data
        restart: unless-stopped

    postgres-notification:
        image: postgres:16
        container_name: distributed-commerce-postgres-notification
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: distributed_commerce_notification_db
        ports:
            - '5440:5432'
        volumes:
            - postgres_notification_data:/var/lib/postgresql/data
        restart: unless-stopped

    elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
        container_name: distributed-commerce-elasticsearch
        environment:
            - discovery.type=single-node
            - xpack.security.enabled=false
        ports:
            - "9200:9200"
        volumes:
            - elasticsearch_data:/usr/share/elasticsearch/data
        restart: unless-stopped

    prometheus:
        image: prom/prometheus
        container_name: distributed-commerce-prometheus
        ports:
            - "9090:9090"
        volumes:
            - ../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
        restart: unless-stopped

    grafana:
        image: grafana/grafana
        container_name: distributed-commerce-grafana
        ports:
            - "3001:3000"
        restart: unless-stopped

volumes:
    redis_data:
    rabbitmq_data:
    postgres_user_data:
    postgres_product_data:
    postgres_order_data:
    postgres_payment_data:
    postgres_search_data:
    postgres_analytics_data:
    postgres_inventory_data:
    postgres_notification_data:
    elasticsearch_data: